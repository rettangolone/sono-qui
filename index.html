<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sono qui 📌</title>
    <style>
        body {
            background-color: #b53d19;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            flex-direction: column;
            transition: background-color 0.3s;
        }
        h1 {
            color: white;
            font-size: 13vw;
            text-align: center;
            margin: 0;
            padding: 20px;
            word-break: break-word;
        }
        #immagine {
            position: fixed;
            bottom: 20px;
            right: 20px;
            max-width: 100px;
            max-height: 100px;
            z-index: 0;
        }
        #mostraPannello {
            position: fixed;
            bottom: 20px;
            left: 20px;
            padding: 6px 12px;
            font-size: 12px;
            background: rgba(255,255,255,0.8);
            color: #b53d19;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 2;
        }
        #pannelloControllo {
            position: fixed;
            bottom: 40px;
            left: 20px;
            display: none;
            flex-direction: column;
            align-items: center;
            background: rgba(0,0,0,0.85);
            padding: 15px;
            border-radius: 10px;
            z-index: 1;
            gap: 10px;
        }
        .password-input {
            margin-bottom: 5px;
        }
        .password-input input {
            padding: 5px 8px;
            font-size: 12px;
        }
        .password-input button {
            padding: 5px 10px;
            font-size: 12px;
            cursor: pointer;
        }
        .pulsanti button {
            font-size: 14px;
            padding: 8px 20px;
            margin: 0 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        #btnA { background: #2ecc71; color: white; }
        #btnB { background: #e74c3c; color: white; }
        #loginBox { display: block; }
        #pulsantiBox { display: none; }
        .color-picker {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .color-picker label {
            color: white;
            font-size: 12px;
        }
        .color-picker input {
            width: 30px;
            height: 30px;
            border: none;
            padding: 0;
            cursor: pointer;
            background: none;
        }
    </style>
</head>
<body>
    <h1 id="citta">Caricamento...</h1>
    
    <img id="immagine" src="poweredby.png" alt="Immagine">
    
    <button id="mostraPannello" onclick="mostraPannello()">⚙️</button>
    
    <div id="pannelloControllo">
        <div class="password-input" id="loginBox">
            <input type="password" id="passwordInput" placeholder="Password">
            <button onclick="verificaPassword()">Accedi</button>
        </div>
        <div class="pulsanti" id="pulsantiBox">
            <button id="btnA" onclick="aggiornaStato('A')">A</button>
            <button id="btnB" onclick="aggiornaStato('B')">B</button>
            <div class="color-picker">
                <label for="coloreSfondo">🎨</label>
                <input type="color" id="coloreSfondo" value="#b53d19" onchange="cambiaColore()">
            </div>
        </div>
    </div>

    <script>
        // ========== CONFIGURAZIONE ==========
        const BIN_ID = '6a6382aada38895dfe8a6356';
        const MASTER_KEY = '$2a$10$s8Au.iF5JdkL/N/tRfYs3O4SE1DTgBCBXdT6hfBKVqIaxX7dhNFPi';
        const PASSWORD = 'yan';
        
        // ========== LEGGI STATO ==========
        function leggiStato() {
            fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: {
                    'X-Master-Key': MASTER_KEY
                }
            })
            .then(response => response.json())
            .then(data => {
                const stato = data.record.stato;
                const colore = data.record.colore;
                aggiornaTesto(stato);
                if (colore) {
                    document.body.style.backgroundColor = colore;
                    document.getElementById('coloreSfondo').value = colore;
                }
            })
            .catch(() => {
                document.getElementById('citta').textContent = 'BOLOGNA';
            });
        }

        // ========== AGGIORNA TESTO ==========
        function aggiornaTesto(stato) {
            if (stato === 'A') {
                document.getElementById('citta').textContent = 'MILANO';
            } else if (stato === 'B') {
                document.getElementById('citta').textContent = 'BOLOGNA';
            } else {
                document.getElementById('citta').textContent = 'OVUNQUE';
            }
        }

        // ========== AGGIORNA STATO (PUT su JSONBin) ==========
        function aggiornaStato(nuovoStato) {
            // Leggi il colore attuale per non perderlo
            const coloreAttuale = document.body.style.backgroundColor || '#b53d19';
            
            fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': MASTER_KEY
                },
                body: JSON.stringify({ 
                    stato: nuovoStato,
                    colore: coloreAttuale
                })
            })
            .then(response => response.json())
            .then(() => {
                aggiornaTesto(nuovoStato);
                alert('Stato aggiornato a: ' + nuovoStato);
            })
            .catch(() => {
                alert('Errore durante l\'aggiornamento');
            });
        }

        // ========== CAMBIA COLORE ==========
        function cambiaColore() {
            const colore = document.getElementById('coloreSfondo').value;
            document.body.style.backgroundColor = colore;
            
            // Leggi lo stato attuale per non perderlo
            fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: {
                    'X-Master-Key': MASTER_KEY
                }
            })
            .then(response => response.json())
            .then(data => {
                const stato = data.record.stato || 'A';
                // Aggiorna JSONBin con nuovo colore e stato invariato
                return fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': MASTER_KEY
                    },
                    body: JSON.stringify({ 
                        stato: stato,
                        colore: colore
                    })
                });
            })
            .catch(() => {
                // Se fallisce, salva almeno il colore in localStorage come fallback
                localStorage.setItem('coloreFallback', colore);
            });
        }

        // ========== MOSTRA PANNELO ==========
        function mostraPannello() {
            const pannello = document.getElementById('pannelloControllo');
            if (pannello.style.display === 'flex') {
                pannello.style.display = 'none';
            } else {
                pannello.style.display = 'flex';
            }
        }

        // ========== VERIFICA PASSWORD ==========
        function verificaPassword() {
            const input = document.getElementById('passwordInput').value;
            if (input === PASSWORD) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('pulsantiBox').style.display = 'block';
            } else {
                alert('Password errata');
            }
        }

        // ========== AVVIO ==========
        leggiStato();
    </script>
</body>
</html>
