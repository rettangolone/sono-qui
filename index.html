<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sono qui 📌</title>
    <style>
        body {
            background-color: #b53d19;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            flex-direction: column;
        }
        h1 {
            color: white;
            font-size: 13vw;
            text-align: center;
            margin: 0;
            padding: 20px;
            word-break: break-word;
        }
        #mostraPannello {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 6px 12px;
            font-size: 12px;
            background: rgba(255,255,255,0.8);
            color: #b53d19;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 2;
        }
        #pannelloControllo {
            position: fixed;
            bottom: 40px;
            right: 20px;
            display: none;
            flex-direction: column;
            align-items: center;
            background: rgba(0,0,0,0.85);
            padding: 15px;
            border-radius: 10px;
            z-index: 1;
        }
        .password-input {
            margin-bottom: 10px;
        }
        .password-input input {
            padding: 5px 8px;
            font-size: 12px;
        }
        .password-input button {
            padding: 5px 10px;
            font-size: 12px;
            cursor: pointer;
        }
        .pulsanti button {
            font-size: 14px;
            padding: 8px 20px;
            margin: 0 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        #btnA { background: #2ecc71; color: white; }
        #btnB { background: #e74c3c; color: white; }
        #loginBox { display: block; }
        #pulsantiBox { display: none; }
    </style>
</head>
<body>
    <h1 id="citta">Caricamento...</h1>
    
    <button id="mostraPannello" onclick="mostraPannello()">⚙️</button>
    
    <div id="pannelloControllo">
        <div class="password-input" id="loginBox">
            <input type="password" id="passwordInput" placeholder="Password">
            <button onclick="verificaPassword()">Accedi</button>
        </div>
        <div class="pulsanti" id="pulsantiBox">
            <button id="btnA" onclick="aggiornaStato('A')">A</button>
            <button id="btnB" onclick="aggiornaStato('B')">B</button>
        </div>
    </div>

    <script>
        // ========== CONFIGURAZIONE ==========
        const GITHUB_TOKEN = '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';
        const REPO_OWNER = 'rettangolone';
        const REPO_NAME = 'sono-qui';
        const FILE_PATH = 'status.json';
        const PASSWORD = '1234';

        // ========== LEGGI STATO ==========
        function leggiStato() {
            fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Accept': 'application/vnd.github.v3+json'
                }
            })
            .then(response => response.json())
            .then(data => {
                const content = atob(data.content);
                const json = JSON.parse(content);
                aggiornaTesto(json.stato);
            })
            .catch(() => {
                document.getElementById('citta').textContent = 'BOLOGNA';
            });
        }

        // ========== AGGIORNA TESTO ==========
        function aggiornaTesto(stato) {
            if (stato === 'A') {
                document.getElementById('citta').textContent = 'MILANO';
            } else if (stato === 'B') {
                document.getElementById('citta').textContent = 'BOLOGNA';
            } else {
                document.getElementById('citta').textContent = 'OVUNQUE';
            }
        }

        // ========== AGGIORNA STATO (PUT su GitHub) ==========
        function aggiornaStato(nuovoStato) {
            // Prima leggi il file per ottenere lo sha attuale
            fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Accept': 'application/vnd.github.v3+json'
                }
            })
            .then(response => response.json())
            .then(data => {
                const sha = data.sha;
                const newContent = JSON.stringify({ stato: nuovoStato });
                const encodedContent = btoa(newContent);

                // Ora aggiorna il file
                return fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify({
                        message: `Stato cambiato a ${nuovoStato}`,
                        content: encodedContent,
                        sha: sha
                    })
                });
            })
            .then(() => {
                aggiornaTesto(nuovoStato);
                alert('Stato aggiornato a: ' + nuovoStato);
            })
            .catch(() => {
                alert('Errore durante l\'aggiornamento');
            });
        }

        // ========== MOSTRA PANNELO ==========
        function mostraPannello() {
            const pannello = document.getElementById('pannelloControllo');
            if (pannello.style.display === 'flex') {
                pannello.style.display = 'none';
            } else {
                pannello.style.display = 'flex';
            }
        }

        // ========== VERIFICA PASSWORD ==========
        function verificaPassword() {
            const input = document.getElementById('passwordInput').value;
            if (input === PASSWORD) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('pulsantiBox').style.display = 'block';
            } else {
                alert('Password errata');
            }
        }

        // ========== AVVIO ==========
        leggiStato();
    </script>
</body>
</html>
