<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sono qui 📌</title>
    <style>
        /* ========== STILI GENERALI ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #b53d19;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Helvetica', Arial, sans-serif;
            flex-direction: column;
            transition: background-color 0.3s;
            overflow: hidden;
        }

        /* ========== SCHERMATA DI CARICAMENTO ========== */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }

        #loadingScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #loadingImage {
            max-width: 60vw;
            max-height: 60vh;
            margin-bottom: 30px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #progressContainer {
            width: 50vw;
            max-width: 500px;
            background: rgba(0,0,0,0.1);
            border-radius: 10px;
            height: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        #progressBar {
            width: 0%;
            height: 100%;
            background: #b53d19;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        #progressText {
            color: #333;
            font-size: 16px;
            font-weight: bold;
        }

        /* ========== PAGINA PRINCIPALE (MAPPA) ========== */
        #mainPage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            position: relative;
        }

        h1 {
            color: white;
            font-size: 13vw;
            text-align: center;
            margin: 0;
            padding: 20px;
            word-break: break-word;
            z-index: 1;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        /* ========== PULSANTI DI NAVIGAZIONE ========== */
        .nav-btn {
            position: fixed;
            bottom: 20px;
            z-index: 10;
            padding: 8px 16px;
            font-size: 14px;
            background: rgba(255,255,255,0.8);
            color: #b53d19;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: bold;
        }

        .nav-btn:hover {
            background: rgba(255,255,255,1);
        }

        #mostraPannello {
            left: 20px;
        }

        #toggleTaskBtn {
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
        }

        #toggleTaskBtn:hover {
            background: rgba(0,0,0,0.9);
        }

        /* ========== PANNELO DI CONTROLLO (COLORE E STATO) ========== */
        #pannelloControllo {
            position: fixed;
            bottom: 40px;
            left: 20px;
            display: none;
            flex-direction: column;
            align-items: center;
            background: rgba(0,0,0,0.85);
            padding: 15px;
            border-radius: 10px;
            z-index: 10;
            gap: 10px;
            min-width: 150px;
        }

        .password-input {
            margin-bottom: 5px;
        }

        .password-input input {
            padding: 5px 8px;
            font-size: 12px;
        }

        .password-input button {
            padding: 5px 10px;
            font-size: 12px;
            cursor: pointer;
        }

        .pulsanti {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .pulsanti-row {
            display: flex;
            flex-direction: row;
            gap: 10px;
            justify-content: center;
            width: 100%;
        }

        .pulsanti-row button {
            font-size: 14px;
            padding: 8px 20px;
            margin: 0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            flex: 1;
        }

        #btn7 { background: #2ecc71; color: white; }
        #btn90 { background: #e74c3c; color: white; }

        #loginBox { display: block; }
        #pulsantiBox { display: none; }

        .color-picker {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            width: 100%;
        }

        .color-picker input {
            width: 30px;
            height: 30px;
            border: none;
            padding: 0;
            cursor: pointer;
            background: none;
        }

        .separatore {
            width: 100%;
            border-top: 1px solid rgba(255,255,255,0.15);
            margin: 2px 0;
        }

        /* ========== TASK MANAGER (OVERLAY) ========== */
        #taskOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            z-index: 100;
            display: none;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
        }

        #taskOverlay.active {
            display: flex;
        }

        #taskOverlay .container {
            max-width: 1200px;
            width: 100%;
            background: #2d2d2d;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            padding: 15px 25px 20px;
            max-height: 90vh;
            overflow-y: auto;
        }

        /* ========== TASK OVERLAY TOP BAR ========== */
        .task-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0px;
            padding: 0;
            min-height: 40px;
        }

        .task-top-bar .back-link {
            color: #3498db;
            text-decoration: none;
            font-size: 0.9rem;
            cursor: pointer;
            background: none;
            border: none;
            padding: 5px 10px;
            flex-shrink: 0;
        }

        .task-top-bar .back-link:hover {
            text-decoration: underline;
        }

        #taskOverlay .header {
            text-align: center;
            padding: 0px 0 10px 0;
            flex: 1;
        }

        #taskOverlay .header h1 {
            color: #f0f0f0;
            font-size: 2rem;
            pointer-events: auto;
            padding: 0;
            margin: 0;
        }

        #taskOverlay .header h1 span {
            color: #e74c3c;
        }

        #taskOverlay .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 5px 0;
        }

        #taskOverlay .quadrant {
            border: 2px solid #444;
            border-radius: 12px;
            padding: 10px 12px;
            background: #222;
            min-height: 180px;
            display: flex;
            flex-direction: column;
        }

        #taskOverlay .quadrant-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: #ccc;
            background: #333;
            padding: 4px 10px;
            border-radius: 6px;
            margin-bottom: 6px;
            text-align: center;
            flex-shrink: 0;
        }

        #taskOverlay .input-row {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
            flex-shrink: 0;
        }

        #taskOverlay .input-row input {
            flex: 1;
            padding: 5px 8px;
            border: 1px solid #555;
            border-radius: 6px;
            font-size: 0.8rem;
            background: #333;
            color: #eee;
            min-width: 0;
        }

        #taskOverlay .input-row input:focus {
            outline: none;
            border-color: #3498db;
        }

        #taskOverlay .input-row input::placeholder {
            color: #888;
        }

        #taskOverlay .input-row button {
            padding: 5px 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
        }

        #taskOverlay .input-row button:hover {
            background: #2980b9;
        }

        #taskOverlay .task-list {
            flex: 1;
            overflow-y: auto;
            max-height: 180px;
        }

        #taskOverlay .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 6px;
            background: #2a2a2a;
            border-radius: 6px;
            margin-bottom: 2px;
            border: 1px solid #444;
            transition: background 0.2s;
        }

        #taskOverlay .task-item:hover {
            background: #333;
        }

        #taskOverlay .task-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }

        #taskOverlay .task-left input[type="checkbox"] {
            width: 15px;
            height: 15px;
            cursor: pointer;
            accent-color: #27ae60;
            flex-shrink: 0;
        }

        #taskOverlay .task-text {
            font-size: 0.85rem;
            color: #eee;
            word-break: break-word;
        }

        #taskOverlay .task-text.done {
            text-decoration: line-through;
            color: #777;
        }

        #taskOverlay .task-right {
            display: flex;
            gap: 3px;
            flex-shrink: 0;
            margin-left: 6px;
        }

        #taskOverlay .task-right button {
            padding: 2px 6px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7rem;
            transition: background 0.2s;
        }

        #taskOverlay .btn-add-sub {
            background: #f39c12;
            color: white;
        }

        #taskOverlay .btn-add-sub:hover {
            background: #e67e22;
        }

        #taskOverlay .btn-delete {
            background: #e74c3c;
            color: white;
        }

        #taskOverlay .btn-delete:hover {
            background: #c0392b;
        }

        #taskOverlay .btn-delete-sub {
            background: #e74c3c;
            color: white;
            font-size: 0.6rem;
            padding: 1px 5px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        #taskOverlay .btn-delete-sub:hover {
            background: #c0392b;
        }

        #taskOverlay .subtask-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 6px 2px 24px;
            border-left: 2px solid #555;
            margin: 1px 0 1px 8px;
            background: #242424;
            border-radius: 0 4px 4px 0;
        }

        #taskOverlay .subtask-left {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            min-width: 0;
        }

        #taskOverlay .subtask-left input[type="checkbox"] {
            width: 13px;
            height: 13px;
            cursor: pointer;
            accent-color: #27ae60;
            flex-shrink: 0;
        }

        #taskOverlay .subtask-text {
            font-size: 0.75rem;
            color: #ddd;
            word-break: break-word;
        }

        #taskOverlay .subtask-text.done {
            text-decoration: line-through;
            color: #777;
        }

        #taskOverlay .footer {
            text-align: center;
            padding-top: 12px;
            color: #666;
            font-size: 0.7rem;
            border-top: 1px solid #444;
            margin-top: 12px;
        }

        #taskOverlay .footer span {
            color: #e74c3c;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            #taskOverlay .grid {
                grid-template-columns: 1fr;
            }
            #taskOverlay .header h1 {
                font-size: 1.6rem;
            }
            #taskOverlay .container {
                padding: 12px 15px;
            }
            .task-top-bar {
                flex-wrap: wrap;
                gap: 5px;
            }
            #taskOverlay .task-list {
                max-height: 140px;
            }
        }

        @media (max-width: 480px) {
            #taskOverlay .header h1 {
                font-size: 1.2rem;
            }
            #taskOverlay .input-row {
                flex-wrap: wrap;
            }
            #taskOverlay .input-row input {
                min-width: 100%;
            }
            #taskOverlay .input-row button {
                width: 100%;
            }
            #taskOverlay .task-item {
                flex-wrap: wrap;
            }
            #taskOverlay .task-right {
                margin-top: 3px;
            }
            #taskOverlay .task-list {
                max-height: 120px;
            }
        }
    </style>
</head>
<body>

    <!-- ========== SCHERMATA DI CARICAMENTO ========== -->
    <div id="loadingScreen">
        <img id="loadingImage" src="cj2.png" alt="Caricamento">
        <div id="progressContainer">
            <div id="progressBar"></div>
        </div>
        <span id="progressText">0%</span>
    </div>

    <!-- ========== PAGINA PRINCIPALE ========== -->
    <div id="mainPage">
        <h1 id="citta">Caricamento...</h1>
        
        <button id="mostraPannello" class="nav-btn" onclick="mostraPannello()">⚙️</button>
        <button id="toggleTaskBtn" class="nav-btn" onclick="toggleTask()">Stuttù 🫑</button>
        
        <div id="pannelloControllo">
            <div class="password-input" id="loginBox">
                <input type="password" id="passwordInput" placeholder="Password">
                <button onclick="verificaPassword()">Accedi</button>
            </div>
            <div class="pulsanti" id="pulsantiBox">
                <div class="pulsanti-row">
                    <button id="btn7" onclick="aggiornaStato('A')">7</button>
                    <button id="btn90" onclick="aggiornaStato('B')">90</button>
                    <div class="color-picker">
                        <input type="color" id="coloreSfondo" value="#b53d19" onchange="cambiaColore()">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== TASK MANAGER (OVERLAY) ========== -->
    <div id="taskOverlay">
        <div class="container">
            <!-- Top bar con back link e titolo allineato -->
            <div class="task-top-bar">
                <button class="back-link" onclick="toggleTask()">← Sono qui 📌</button>
                <div class="header">
                    <h1>scrivilo, fallo, <span>stuttù</span> 🫑</h1>
                </div>
                <div style="width: 120px; flex-shrink: 0;"></div> <!-- Spazio vuoto per bilanciare -->
            </div>

            <div class="grid" id="gridContainer"></div>

            <div class="footer">
                SFX: Yan Montanari
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. CONFIGURAZIONE
        // ============================================================
        const BIN_ID = '6a6382aada38895dfe8a6356';
        const MASTER_KEY = '$2a$10$s8Au.iF5JdkL/N/tRfYs3O4SE1DTgBCBXdT6hfBKVqIaxX7dhNFPi';
        const PASSWORD = 'yan';
        
        let statoCorrente = 'A';
        let coloreCorrente = '#b53d19';

        // ============================================================
        // 2. CARICAMENTO PROGRESSIVO
        // ============================================================
        function simulaCaricamento() {
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            const loadingScreen = document.getElementById('loadingScreen');
            let progress = 0;

            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 10) + 5;
                if (progress > 100) progress = 100;
                progressBar.style.width = progress + '%';
                progressText.textContent = progress + '%';

                if (progress === 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        loadingScreen.classList.add('hidden');
                        setTimeout(() => {
                            loadingScreen.style.display = 'none';
                        }, 800);
                    }, 500);
                }
            }, 150);
        }

        // ============================================================
        // 3. MAPPA (STATO E COLORE)
        // ============================================================
        function leggiStato() {
            fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': MASTER_KEY }
            })
            .then(response => response.json())
            .then(data => {
                const stato = data.record.stato || 'A';
                const colore = data.record.colore || '#b53d19';
                statoCorrente = stato;
                coloreCorrente = colore;
                aggiornaTesto(stato);
                document.body.style.backgroundColor = colore;
                document.getElementById('coloreSfondo').value = colore;
                document.getElementById('progressBar').style.backgroundColor = colore;
            })
            .catch(() => {
                document.getElementById('citta').textContent = 'BOLOGNA';
            });
        }

        function aggiornaTesto(stato) {
            statoCorrente = stato;
            if (stato === 'A') {
                document.getElementById('citta').textContent = 'MILANO';
            } else if (stato === 'B') {
                document.getElementById('citta').textContent = 'BOLOGNA';
            } else {
                document.getElementById('citta').textContent = 'OVUNQUE';
            }
        }

        function salvaStato() {
            fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': MASTER_KEY
                },
                body: JSON.stringify({
                    stato: statoCorrente,
                    colore: coloreCorrente
                })
            }).catch(() => console.log('Errore salvataggio'));
        }

        function aggiornaStato(nuovoStato) {
            statoCorrente = nuovoStato;
            aggiornaTesto(nuovoStato);
            salvaStato();
            alert('Stato aggiornato a: ' + (nuovoStato === 'A' ? '7' : '90'));
        }

        function cambiaColore() {
            coloreCorrente = document.getElementById('coloreSfondo').value;
            document.body.style.backgroundColor = coloreCorrente;
            document.getElementById('progressBar').style.backgroundColor = coloreCorrente;
            salvaStato();
        }

        function mostraPannello() {
            const pannello = document.getElementById('pannelloControllo');
            pannello.style.display = pannello.style.display === 'flex' ? 'none' : 'flex';
        }

        function verificaPassword() {
            const input = document.getElementById('passwordInput').value;
            if (input === PASSWORD) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('pulsantiBox').style.display = 'flex';
            } else {
                alert('Password errata');
            }
        }

        // ============================================================
        // 4. TOGGLE TASK MANAGER
        // ============================================================
        function toggleTask() {
            const overlay = document.getElementById('taskOverlay');
            overlay.classList.toggle('active');
            
            if (overlay.classList.contains('active')) {
                document.title = "Stuttù 🫑";
                renderTasks();
            } else {
                document.title = "Sono qui 📌";
            }
        }

        // ============================================================
        // 5. TASK MANAGER (LOGICA E RENDER)
        // ============================================================
        const CATEGORIES = ["urgente, importante", "urgente, non importante", "non urgente, importante", "non urgente, non importante"];
        const CATEGORY_MAP = {
            "FORMICA": "urgente, importante",
            "FARFALLA": "urgente, non importante",
            "RAGNO": "non urgente, importante",
            "CICALA": "non urgente, non importante"
        };

        function getTasks() {
            try {
                const data = localStorage.getItem('stuttu_tasks');
                let tasks = data ? JSON.parse(data) : [];
                tasks = tasks.map(task => {
                    if (CATEGORY_MAP[task.category]) {
                        task.category = CATEGORY_MAP[task.category];
                    }
                    return task;
                });
                return tasks;
            } catch {
                return [];
            }
        }

        function saveTasks(tasks) {
            localStorage.setItem('stuttu_tasks', JSON.stringify(tasks));
        }

        let tasks = getTasks();

        function renderTasks() {
            const grid = document.getElementById('gridContainer');
            if (!grid) return;
            
            grid.innerHTML = '';

            CATEGORIES.forEach(cat => {
                const quadrant = document.createElement('div');
                quadrant.className = 'quadrant';

                const title = document.createElement('div');
                title.className = 'quadrant-title';
                title.textContent = cat;
                quadrant.appendChild(title);

                const inputRow = document.createElement('div');
                inputRow.className = 'input-row';

                const input = document.createElement('input');
                input.type = 'text';
                input.placeholder = 'Nuovo task...';
                input.id = `input_${cat.replace(/[^a-zA-Z0-9]/g, '_')}`;

                const addBtn = document.createElement('button');
                addBtn.textContent = 'Aggiungi';
                addBtn.onclick = () => addTask(cat, input.value);

                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') addTask(cat, input.value);
                });

                inputRow.appendChild(input);
                inputRow.appendChild(addBtn);
                quadrant.appendChild(inputRow);

                const taskList = document.createElement('div');
                taskList.className = 'task-list';
                taskList.id = `list_${cat.replace(/[^a-zA-Z0-9]/g, '_')}`;

                const catTasks = tasks.filter(t => t.category === cat);

                catTasks.forEach((task, index) => {
                    const realIndex = tasks.indexOf(task);

                    const taskItem = document.createElement('div');
                    taskItem.className = 'task-item';

                    const left = document.createElement('div');
                    left.className = 'task-left';

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.checked = task.done;
                    checkbox.onchange = () => toggleTaskCheckbox(realIndex);

                    const text = document.createElement('span');
                    text.className = `task-text${task.done ? ' done' : ''}`;
                    text.textContent = task.text;

                    left.appendChild(checkbox);
                    left.appendChild(text);

                    const right = document.createElement('div');
                    right.className = 'task-right';

                    const addSubBtn = document.createElement('button');
                    addSubBtn.className = 'btn-add-sub';
                    addSubBtn.textContent = '+';
                    addSubBtn.onclick = () => addSubtask(realIndex);

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'btn-delete';
                    deleteBtn.textContent = '✖';
                    deleteBtn.onclick = () => deleteTask(realIndex);

                    right.appendChild(addSubBtn);
                    right.appendChild(deleteBtn);

                    taskItem.appendChild(left);
                    taskItem.appendChild(right);
                    taskList.appendChild(taskItem);

                    task.subtasks.forEach((sub, subIndex) => {
                        const subItem = document.createElement('div');
                        subItem.className = 'subtask-item';

                        const subLeft = document.createElement('div');
                        subLeft.className = 'subtask-left';

                        const subCheckbox = document.createElement('input');
                        subCheckbox.type = 'checkbox';
                        subCheckbox.checked = sub.done;
                        subCheckbox.onchange = () => toggleSubtask(realIndex, subIndex);

                        const subText = document.createElement('span');
                        subText.className = `subtask-text${sub.done ? ' done' : ''}`;
                        subText.textContent = sub.text;

                        subLeft.appendChild(subCheckbox);
                        subLeft.appendChild(subText);

                        const subDelete = document.createElement('button');
                        subDelete.className = 'btn-delete-sub';
                        subDelete.textContent = '✖';
                        subDelete.onclick = () => deleteSubtask(realIndex, subIndex);

                        subItem.appendChild(subLeft);
                        subItem.appendChild(subDelete);

                        taskList.appendChild(subItem);
                    });
                });

                quadrant.appendChild(taskList);
                grid.appendChild(quadrant);
            });
        }

        function addTask(category, text) {
            text = text.trim();
            if (!text) return;

            tasks.push({ text, done: false, category, subtasks: [] });
            saveTasks(tasks);
            const inputId = `input_${category.replace(/[^a-zA-Z0-9]/g, '_')}`;
            const input = document.getElementById(inputId);
            if (input) input.value = '';
            renderTasks();
            playSound();
        }

        function toggleTaskCheckbox(index) {
            tasks[index].done = !tasks[index].done;
            if (tasks[index].done) playSound();
            saveTasks(tasks);
            renderTasks();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            saveTasks(tasks);
            renderTasks();
        }

        function addSubtask(index) {
            const text = prompt('Nuova sotto-task:');
            if (text && text.trim()) {
                tasks[index].subtasks.push({ text: text.trim(), done: false });
                saveTasks(tasks);
                renderTasks();
            }
        }

        function toggleSubtask(index, subIndex) {
            tasks[index].subtasks[subIndex].done = !tasks[index].subtasks[subIndex].done;
            if (tasks[index].subtasks[subIndex].done) playSound();
            saveTasks(tasks);
            renderTasks();
        }

        function deleteSubtask(index, subIndex) {
            tasks[index].subtasks.splice(subIndex, 1);
            saveTasks(tasks);
            renderTasks();
        }

        function playSound() {
            const audio = new Audio('stututu.mp3');
            audio.volume = 0.4;
            audio.play().catch(() => {});
        }

        // ============================================================
        // 6. AVVIO
        // ============================================================
        document.getElementById('progressBar').style.backgroundColor = '#b53d19';
        simulaCaricamento();
        setTimeout(leggiStato, 100);
        
        renderTasks();
    </script>

</body>
</html>
