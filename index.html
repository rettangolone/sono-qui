<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Calendario</title>
    <style>
        body {
            background-color: #51e851; /* Cambia colore qui */
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            flex-direction: column;
        }
        h1 {
            color: white;
            font-size: 48px;
            margin-bottom: 30px;
        }
        .calendario {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            font-size: 20px;
            width: 300px;
        }
        .calendario table {
            width: 100%;
            border-collapse: collapse;
        }
        .calendario td {
            padding: 10px;
            text-align: center;
        }
        .cerchiato {
            background-color: #e74c3c;
            color: white;
            border-radius: 50%;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>sono a Bologna fino al 30 luglio</h1>
    <div class="calendario">
        <h3>Luglio 2026</h3>
        <table>
            <tr><th>L</th><th>M</th><th>M</th><th>G</th><th>V</th><th>S</th><th>D</th></tr>
            <tr><td></td><td></td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td></tr>
            <tr><td>6</td><td>7</td><td>8</td><td>9</td><td>10</td><td>11</td><td>12</td></tr>
            <tr><td>13</td><td>14</td><td>15</td><td>16</td><td>17</td><td>18</td><td>19</td></tr>
            <tr><td>20</td><td>21</td><td>22</td><td>23</td><td>24</td><td>25</td><td>26</td></tr>
            <tr><td>27</td><td>28</td><td>29</td><td class="cerchiato">30</td><td>31</td><td></td><td></td></tr>
        </table>
        <p style="margin-top:10px; font-size:14px; color:gray;">Data cerchiata: 24 Luglio</p>
    </div>
</body>
</html>
