<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sono qui 📌</title>
    <style>
        body {
            background-color: #b53d19;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            flex-direction: column;
            transition: background-color 0.3s;
            overflow: hidden;
        }
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #b53d19;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }
        #loadingScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loadingImage {
            max-width: 60vw;
            max-height: 60vh;
            margin-bottom: 30px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        #progressContainer {
            width: 50vw;
            max-width: 500px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            height: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        #progressBar {
            width: 0%;
            height: 100%;
            background: white;
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        #progressText {
            color: white;
            font-size: 16px;
            font-weight: bold;
        }
        h1 {
            color: white;
            font-size: 13vw;
            text-align: center;
            margin: 0;
            padding: 20px;
            word-break: break-word;
            z-index: 1;
            pointer-events: none;
        }
        #mostraPannello {
            position: fixed;
            bottom: 20px;
            left: 20px;
            padding: 6px 12px;
            font-size: 12px;
            background: rgba(255,255,255,0.8);
            color: #b53d19;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 10;
        }
        #pannelloControllo {
            position: fixed;
            bottom: 40px;
            left: 20px;
            display: none;
            flex-direction: column;
            align-items: center;
            background: rgba(0,0,0,0.85);
            padding: 15px;
            border-radius: 10px;
            z-index: 10;
            gap: 10px;
            min-width: 150px;
        }
        .password-input {
            margin-bottom: 5px;
        }
        .password-input input {
            padding: 5px 8px;
            font-size: 12px;
        }
        .password-input button {
            padding: 5px 10px;
            font-size: 12px;
            cursor: pointer;
        }
        .pulsanti {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }
        .pulsanti-row {
            display: flex;
            flex-direction: row;
            gap: 10px;
            justify-content: center;
            width: 100%;
        }
        .pulsanti-row button {
            font-size: 14px;
            padding: 8px 20px;
            margin: 0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            flex: 1;
        }
        #btn7 { background: #2ecc71; color: white; }
        #btn90 { background: #e74c3c; color: white; }
        #loginBox { display: block; }
        #pulsantiBox { display: none; }
        .color-picker {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            width: 100%;
        }
        .color-picker input {
            width: 30px;
            height: 30px;
            border: none;
            padding: 0;
            cursor: pointer;
            background: none;
        }
        .separatore {
            width: 100%;
            border-top: 1px solid rgba(255,255,255,0.15);
            margin: 2px 0;
        }
    </style>
</head>
<body>
    <!-- Schermata di caricamento -->
    <div id="loadingScreen">
        <img id="loadingImage" src="cj2.png" alt="Caricamento">
        <div id="progressContainer">
            <div id="progressBar"></div>
        </div>
        <span id="progressText">0%</span>
    </div>

    <h1 id="citta">Caricamento...</h1>
    
    <button id="mostraPannello" onclick="mostraPannello()">⚙️</button>
    
    <div id="pannelloControllo">
        <div class="password-input" id="loginBox">
            <input type="password" id="passwordInput" placeholder="Password">
            <button onclick="verificaPassword()">Accedi</button>
        </div>
        <div class="pulsanti" id="pulsantiBox">
            <div class="pulsanti-row">
                <button id="btn7" onclick="aggiornaStato('A')">7</button>
                <button id="btn90" onclick="aggiornaStato('B')">90</button>
                <div class="color-picker">
                    <input type="color" id="coloreSfondo" value="#b53d19" onchange="cambiaColore()">
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========== CONFIGURAZIONE ==========
        const BIN_ID = '6a6382aada38895dfe8a6356';
        const MASTER_KEY = '$2a$10$s8Au.iF5JdkL/N/tRfYs3O4SE1DTgBCBXdT6hfBKVqIaxX7dhNFPi';
        const PASSWORD = 'yan';
        
        let statoCorrente = 'A';
        let coloreCorrente = '#b53d19';

        // ========== CARICAMENTO PROGRESSIVO ==========
        function simulaCaricamento() {
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            const loadingScreen = document.getElementById('loadingScreen');
            let progress = 0;

            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 10) + 5;
                if (progress > 100) progress = 100;
                progressBar.style.width = progress + '%';
                progressText.textContent = progress + '%';

                if (progress === 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        loadingScreen.classList.add('hidden');
                        setTimeout(() => {
                            loadingScreen.style.display = 'none';
                        }, 800);
                    }, 500);
                }
            }, 150);
        }

        // ========== LEGGI STATO ==========
        function leggiStato() {
            fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: {
                    'X-Master-Key': MASTER_KEY
                }
            })
            .then(response => response.json())
            .then(data => {
                const stato = data.record.stato || 'A';
                const colore = data.record.colore || '#b53d19';
                
                statoCorrente = stato;
                coloreCorrente = colore;
                
                aggiornaTesto(stato);
                document.body.style.backgroundColor = colore;
                document.getElementById('coloreSfondo').value = colore;
            })
            .catch(() => {
                document.getElementById('citta').textContent = 'BOLOGNA';
            });
        }

        // ========== AGGIORNA TESTO ==========
        function aggiornaTesto(stato) {
            statoCorrente = stato;
            if (stato === 'A') {
                document.getElementById('citta').textContent = 'MILANO';
            } else if (stato === 'B') {
                document.getElementById('citta').textContent = 'BOLOGNA';
            } else {
                document.getElementById('citta').textContent = 'OVUNQUE';
            }
        }

        // ========== SALVA STATO SU JSONBIN ==========
        function salvaStato() {
            fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': MASTER_KEY
                },
                body: JSON.stringify({
                    stato: statoCorrente,
                    colore: coloreCorrente
                })
            })
            .catch(() => {
                console.log('Errore durante il salvataggio');
            });
        }

        // ========== AGGIORNA STATO ==========
        function aggiornaStato(nuovoStato) {
            statoCorrente = nuovoStato;
            aggiornaTesto(nuovoStato);
            salvaStato();
            alert('Stato aggiornato a: ' + (nuovoStato === 'A' ? '7' : '90'));
        }

        // ========== CAMBIA COLORE ==========
        function cambiaColore() {
            coloreCorrente = document.getElementById('coloreSfondo').value;
            document.body.style.backgroundColor = coloreCorrente;
            salvaStato();
        }

        // ========== MOSTRA PANNELO ==========
        function mostraPannello() {
            const pannello = document.getElementById('pannelloControllo');
            if (pannello.style.display === 'flex') {
                pannello.style.display = 'none';
            } else {
                pannello.style.display = 'flex';
            }
        }

        // ========== VERIFICA PASSWORD ==========
        function verificaPassword() {
            const input = document.getElementById('passwordInput').value;
            if (input === PASSWORD) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('pulsantiBox').style.display = 'flex';
            } else {
                alert('Password errata');
            }
        }

        // ========== AVVIO ==========
        simulaCaricamento();
        setTimeout(leggiStato, 100);
    </script>
</body>
</html>
